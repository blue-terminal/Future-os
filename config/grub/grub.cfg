# Future OS - GRUB Configuration
set default=0
set timeout=5
set timeout_style=menu

insmod part_gpt
insmod fat
insmod ext2
insmod gfxterm
insmod gfxmenu
insmod png

set gfxmode=1920x1080,auto
set gfxpayload=keep
terminal_output gfxterm

# Tema Future OS
set theme=/boot/grub/themes/future-os/theme.txt

menuentry "Future OS 1.0 Horizon" --class future-os --class gnu-linux --class gnu --class os {
    insmod gzio
    insmod part_gpt
    insmod ext2
    linux /boot/vmlinuz-linux root=LABEL=future-os rw quiet splash loglevel=3 rd.udev.log_level=3
    initrd /boot/initramfs-linux.img
}

menuentry "Future OS (modalità sicura)" --class future-os {
    insmod gzio
    linux /boot/vmlinuz-linux root=LABEL=future-os rw nomodeset
    initrd /boot/initramfs-linux.img
}

menuentry "Memoria (Memtest86+)" {
    linux /boot/memtest86+.bin
}
