[Appearance]
GtkTheme=FutureOS-Dark
IconTheme=FutureOS
CursorTheme=FutureOS-Cursors
FontName=Inter 11
MonospaceFont=JetBrains Mono 11
DocumentFont=Noto Serif 11

[Wallpaper]
Default=/usr/share/future-os/wallpapers/future-horizon-dark.png
Mode=zoom

[Desktop]
ShowIcons=true
IconSize=48
ShowTrash=true
ShowHome=false

[Notifications]
Position=top-right
Timeout=4000
Sounds=true

[Power]
SleepTimeout=900
ScreenOffTimeout=300
HibernateEnabled=false

[Privacy]
RecentFilesEnabled=false
LocationEnabled=false
TelemetryEnabled=false

[Security]
FirewallEnabled=true
AutoUpdatesEnabled=true

[Locale]
Language=it_IT.UTF-8
TimeZone=Europe/Rome
DateFormat=%d/%m/%Y
TimeFormat=%H:%M
