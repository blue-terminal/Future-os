[Panel]
Orientation=top
Size=32
BackgroundType=color
BackgroundColor=#0d1526
Opacity=240
Expand=true
Autohide=false

[Applets]
Left=future-os-menu,separator,window-list
Center=clock
Right=systray,notification-area,network,volume,battery,user-menu

[Clock]
Format=24h
ShowDate=true
ShowSeconds=false
Timezone=Europe/Rome

[Menu]
IconName=future-os-logo
Label=Future OS
ShowArrow=false

[Taskbar]
GroupWindows=true
ShowWindowThumbs=true
ButtonMaxWidth=200
