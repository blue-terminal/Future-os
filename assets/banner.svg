<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="violet-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="900" height="280" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="14" fill="url(#bg)"/>
  <g clip-path="url(#clip)">

    <!-- Grid lines -->
    <g stroke="#1e2d45" stroke-width="0.5" opacity="0.5">
      <line x1="0" y1="40"  x2="900" y2="40"/>
      <line x1="0" y1="80"  x2="900" y2="80"/>
      <line x1="0" y1="120" x2="900" y2="120"/>
      <line x1="0" y1="160" x2="900" y2="160"/>
      <line x1="0" y1="200" x2="900" y2="200"/>
      <line x1="0" y1="240" x2="900" y2="240"/>
      <line x1="100" y1="0" x2="100" y2="280"/>
      <line x1="200" y1="0" x2="200" y2="280"/>
      <line x1="300" y1="0" x2="300" y2="280"/>
      <line x1="400" y1="0" x2="400" y2="280"/>
      <line x1="500" y1="0" x2="500" y2="280"/>
      <line x1="600" y1="0" x2="600" y2="280"/>
      <line x1="700" y1="0" x2="700" y2="280"/>
      <line x1="800" y1="0" x2="800" y2="280"/>
    </g>

    <!-- Circuit decorations left -->
    <g stroke="#1e2d45" stroke-width="1.5" fill="none" opacity="0.7">
      <polyline points="20,60 20,100 60,100 60,140 100,140"/>
      <polyline points="20,220 20,180 60,180 60,160"/>
      <polyline points="40,240 80,240 80,200 120,200"/>
      <circle cx="20" cy="60" r="3" fill="#00d4ff" stroke="none"/>
      <circle cx="60" cy="100" r="3" fill="#00d4ff" stroke="none"/>
      <circle cx="60" cy="180" r="3" fill="#7c3aed" stroke="none"/>
      <circle cx="80" cy="240" r="3" fill="#00d4ff" stroke="none"/>
    </g>

    <!-- Circuit decorations right -->
    <g stroke="#1e2d45" stroke-width="1.5" fill="none" opacity="0.7">
      <polyline points="880,60 880,100 840,100 840,140 800,140"/>
      <polyline points="880,220 880,180 840,180 840,160"/>
      <polyline points="860,240 820,240 820,200 780,200"/>
      <circle cx="880" cy="60" r="3" fill="#00d4ff" stroke="none"/>
      <circle cx="840" cy="100" r="3" fill="#00d4ff" stroke="none"/>
      <circle cx="840" cy="180" r="3" fill="#7c3aed" stroke="none"/>
      <circle cx="820" cy="240" r="3" fill="#00d4ff" stroke="none"/>
    </g>

    <!-- Glow lines top/bottom -->
    <rect x="0" y="0" width="900" height="2" fill="url(#cyan-glow)" opacity="0.8"/>
    <rect x="0" y="278" width="900" height="2" fill="url(#cyan-glow)" opacity="0.8"/>

    <!-- Center glow blob -->
    <ellipse cx="450" cy="140" rx="260" ry="90" fill="#00d4ff" opacity="0.03" filter="url(#glow-soft)"/>
    <ellipse cx="450" cy="140" rx="180" ry="60" fill="#7c3aed" opacity="0.04" filter="url(#glow-soft)"/>

    <!-- OS icon / logo mark -->
    <g transform="translate(450,72)" filter="url(#glow-cyan)">
      <!-- Hexagon -->
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="none" stroke="#00d4ff" stroke-width="1.5"/>
      <!-- Inner F -->
      <text x="0" y="10" font-family="monospace" font-size="22" font-weight="bold" fill="#00d4ff" text-anchor="middle">F</text>
    </g>

    <!-- Main title -->
    <text x="450" y="136"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="52"
      font-weight="700"
      fill="#e2e8f0"
      text-anchor="middle"
      letter-spacing="8"
      filter="url(#glow-text)">FUTURE OS</text>

    <!-- Cyan underline -->
    <rect x="260" y="148" width="380" height="2" rx="1" fill="url(#cyan-glow)"/>

    <!-- Tagline -->
    <text x="450" y="182"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="15"
      fill="#94a3b8"
      text-anchor="middle"
      letter-spacing="4">SECURITY &amp; PRIVACY FIRST</text>

    <!-- Version badge -->
    <rect x="360" y="204" width="180" height="30" rx="6" fill="#111827" stroke="#1e2d45" stroke-width="1"/>
    <text x="450" y="224"
      font-family="monospace"
      font-size="13"
      fill="#00d4ff"
      text-anchor="middle"
      letter-spacing="2">v1.0 HORIZON</text>

    <!-- Dots decoration -->
    <g fill="#00d4ff" opacity="0.6">
      <circle cx="340" cy="219" r="2"/>
      <circle cx="560" cy="219" r="2"/>
    </g>

    <!-- Bottom bar -->
    <g font-family="monospace" font-size="11" fill="#475569" text-anchor="middle">
      <text x="180" y="262">ID_LIKE=debian</text>
      <text x="450" y="262">https://futureos.io</text>
      <text x="720" y="262">GPL-3.0</text>
    </g>

    <!-- Border -->
    <rect x="0.75" y="0.75" width="898.5" height="278.5" rx="13.5" fill="none" stroke="#1e2d45" stroke-width="1.5"/>
  </g>
</svg>
